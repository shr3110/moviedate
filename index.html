<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CinemaCall</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e0f13;color:#eee;font:15px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
button{background:#2a2d38;color:#eee;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit}
button:hover{background:#3a3e4d}.primary{background:#e50914}.primary:hover{background:#ff1f2b}
#home{margin:auto;text-align:center;padding:24px}#home h1{font-size:44px;margin:0 0 8px}#home p{color:#9aa}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#161820;flex-wrap:wrap}
header b{margin-right:auto}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-width:0}
#mv{width:100%;height:100%;background:#000}
#empty{text-align:center;color:#9aa;padding:20px}
#bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:#e50914;width:0;display:none}
#side{width:230px;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;background:#12131a}
.tile{position:relative;border-radius:10px;overflow:hidden;background:#222;aspect-ratio:4/3}
.tile video{width:100%;height:100%;object-fit:cover}
.tile.me video{transform:scaleX(-1)}
.tile span{position:absolute;left:6px;bottom:4px;font-size:12px;background:#0009;padding:2px 6px;border-radius:4px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#333;padding:10px 16px;border-radius:8px;display:none}
@media(max-width:700px){main{flex-direction:column}#side{width:auto;flex-direction:row;height:120px}.tile{height:100%;flex:none}}
</style></head><body>

<div id="home" hidden>
  <h1>🍿 CinemaCall</h1>
  <p>Create a room, upload a movie, share the link. Watch together while you see each other.</p>
  <button class="primary" id="create">Create a room</button>
</div>

<div id="room" hidden style="display:none;flex:1;flex-direction:column;min-height:0">
  <header>
    <b>🍿 CinemaCall</b>
    <button id="up">⬆ Upload movie (.mp4)</button>
    <button id="mic">🎤 Mic</button>
    <button id="cam">📷 Camera</button>
    <button id="fs">⛶ Fullscreen</button>
    <button class="primary" id="copy">🔗 Copy invite link</button>
    <input type="file" id="file" accept="video/mp4,video/*" hidden>
  </header>
  <main>
    <div id="stage">
      <div id="empty">No movie yet.<br>Click <b>Upload movie</b> — everyone in the room gets it automatically.</div>
      <video id="mv" controls playsinline hidden></video>
      <div id="bar"></div>
    </div>
    <div id="side"></div>
  </main>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const roomId = location.pathname.startsWith('/r/') ? location.pathname.slice(3) : null;
const toast = t => { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 3500); };

if (!roomId) {
  $('#home').hidden = false;
  $('#create').onclick = () => location.href = '/r/' + Math.random().toString(36).slice(2, 8);
} else start();

async function start() {
  const r = $('#room'); r.hidden = false; r.style.display = 'flex';
  let local;
  try { local = await navigator.mediaDevices.getUserMedia({ video: true, audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch { local = new MediaStream(); toast('No camera/mic (needs HTTPS or localhost). Joined as viewer.'); }
  addTile('me', local, true);

  const ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws?room=' + roomId);
  const send = o => ws.readyState === 1 && ws.send(JSON.stringify(o));
  const pcs = {};

  function pc(id) {
    if (pcs[id]) return pcs[id];
    const p = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    if (local.getTracks().length) local.getTracks().forEach(t => p.addTrack(t, local));
    else { p.addTransceiver('video', { direction: 'recvonly' }); p.addTransceiver('audio', { direction: 'recvonly' }); }
    p.onicecandidate = e => e.candidate && send({ t: 'signal', to: id, data: { ice: e.candidate } });
    p.ontrack = e => addTile(id, e.streams[0]);
    return pcs[id] = p;
  }

  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.t === 'welcome') {
      for (const id of m.peers) { const p = pc(id); await p.setLocalDescription(await p.createOffer()); send({ t: 'signal', to: id, data: { sdp: p.localDescription } }); }
      if (m.movie) loadMovie(m.movie, m.state);
    } else if (m.t === 'signal') {
      const p = pc(m.from), d = m.data;
      if (d.sdp) {
        await p.setRemoteDescription(d.sdp);
        if (d.sdp.type === 'offer') { await p.setLocalDescription(await p.createAnswer()); send({ t: 'signal', to: m.from, data: { sdp: p.localDescription } }); }
      } else if (d.ice) { try { await p.addIceCandidate(d.ice); } catch {} }
    } else if (m.t === 'leave') {
      pcs[m.id]?.close(); delete pcs[m.id]; document.getElementById('t-' + m.id)?.remove();
    } else if (m.t === 'movie') { loadMovie(m.movie, { playing: false, time: 0 }); toast('🎬 Movie ready: ' + m.movie.name); }
    else if (m.t === 'sync') applySync(m);
  };

  // ---- synced player ----
  const v = $('#mv'); let remote = false;
  function loadMovie(m, s) {
    v.src = '/media/' + roomId + '?v=' + m.v; v.hidden = false; $('#empty').style.display = 'none';
    v.onloadedmetadata = () => { v.onloadedmetadata = null; applySync({ action: s.playing ? 'play' : 'pause', time: s.time }); };
  }
  function applySync(m) {
    remote = true;
    if (Math.abs(v.currentTime - m.time) > 0.6) v.currentTime = m.time;
    if (m.action === 'play') v.play().catch(() => toast('Click the video once to allow playback'));
    else if (m.action === 'pause') v.pause();
    setTimeout(() => remote = false, 800);
  }
  v.onplay = () => !remote && send({ t: 'sync', action: 'play', time: v.currentTime });
  v.onpause = () => !remote && send({ t: 'sync', action: 'pause', time: v.currentTime });
  v.onseeked = () => !remote && send({ t: 'sync', action: 'seek', time: v.currentTime });

  // ---- upload with progress ----
  $('#up').onclick = () => $('#file').click();
  $('#file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const x = new XMLHttpRequest(), bar = $('#bar'); bar.style.display = 'block';
    x.open('POST', '/upload/' + roomId + '?name=' + encodeURIComponent(f.name));
    x.upload.onprogress = p => bar.style.width = (p.loaded / p.total * 100) + '%';
    x.onload = () => { bar.style.display = 'none'; bar.style.width = 0; };
    x.onerror = () => toast('Upload failed');
    x.send(f); toast('Uploading ' + f.name + '…');
  };

  // ---- controls ----
  const tog = (kind, btn) => $(btn).onclick = () => {
    const ts = kind === 'a' ? local.getAudioTracks() : local.getVideoTracks();
    ts.forEach(t => t.enabled = !t.enabled);
    $(btn).style.opacity = ts[0]?.enabled ? 1 : .45;
  };
  tog('a', '#mic'); tog('v', '#cam');
  $('#fs').onclick = () => $('#stage').requestFullscreen();
  $('#copy').onclick = () => navigator.clipboard.writeText(location.href).then(() => toast('Link copied!'));
}

function addTile(id, stream, mine) {
  let t = document.getElementById('t-' + id);
  if (!t) {
    t = document.createElement('div'); t.id = 't-' + id; t.className = 'tile' + (mine ? ' me' : '');
    t.innerHTML = '<video autoplay playsinline' + (mine ? ' muted' : '') + '></video><span>' + (mine ? 'You' : 'Guest') + '</span>';
    $('#side').appendChild(t);
  }
  t.querySelector('video').srcObject = stream;
}
</script></body></html>
